<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React itself (no build step / bundler — this is a learning project).
       Versions are pinned so the project behaves identically every time it's
       opened, instead of silently picking up whatever "latest" resolves to. -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>

  <!-- Babel standalone lets the browser transform the JSX in App.jsx on the fly -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!--
    chessLogic.js is plain JavaScript (no JSX), loaded as a normal script
    BEFORE App.jsx so its functions are available as globals when App.jsx runs.
  -->
  <script src="chessLogic.js"></script>

  <!-- App.jsx uses JSX, so it is loaded with type="text/babel" for Babel to
       transform. data-presets makes the transform explicit rather than
       relying on Babel Standalone's undocumented script-tag defaults. -->
  <script type="text/babel" data-presets="react" src="App.jsx"></script>
</body>
</html>
